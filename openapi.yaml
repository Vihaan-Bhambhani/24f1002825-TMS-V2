openapi: 3.0.3
info:
  title: Trekking Management System V2 API
  description: REST API for the Trekking Management Application built with Flask. Supports three roles - Admin, Trek Staff, and Trekker.
  version: "2.0"

servers:
  - url: http://localhost:5000
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, staff, trekker]
        is_active:
          type: boolean
        is_blacklisted:
          type: boolean
        created_at:
          type: string
          format: date-time

    Trek:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        difficulty:
          type: string
          enum: [easy, moderate, hard]
        duration:
          type: integer
        available_slots:
          type: integer
        status:
          type: string
          enum: [pending, approved, open, closed, completed]
        description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        assigned_staff:
          type: integer

    Booking:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        trek_id:
          type: integer
        booking_date:
          type: string
          format: date-time
        booking_status:
          type: string
          enum: [booked, cancelled]

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  # ─────────── Authentication ───────────
  /api/register:
    post:
      tags: [Authentication]
      summary: Register a new trekker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Missing fields or email already exists

  /api/login:
    post:
      tags: [Authentication]
      summary: Login and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
        "403":
          description: Account blacklisted

  # ─────────── Admin - Dashboard ───────────
  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Get dashboard statistics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_treks:
                    type: integer
                  total_users:
                    type: integer
                  total_staff:
                    type: integer
                  total_bookings:
                    type: integer

  # ─────────── Admin - Trek CRUD ───────────
  /api/admin/treks:
    get:
      tags: [Admin]
      summary: Get all treks
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of all treks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trek"

    post:
      tags: [Admin]
      summary: Create a new trek
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, location, difficulty, duration, available_slots]
              properties:
                name:
                  type: string
                location:
                  type: string
                difficulty:
                  type: string
                  enum: [easy, moderate, hard]
                duration:
                  type: integer
                available_slots:
                  type: integer
                description:
                  type: string
                status:
                  type: string
                  enum: [pending, approved, open, closed, completed]
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
      responses:
        "201":
          description: Trek created
        "400":
          description: Missing or invalid fields

  /api/admin/treks/{id}:
    put:
      tags: [Admin]
      summary: Update an existing trek
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: string
                difficulty:
                  type: string
                duration:
                  type: integer
                available_slots:
                  type: integer
                status:
                  type: string
                description:
                  type: string
                start_date:
                  type: string
                end_date:
                  type: string
      responses:
        "200":
          description: Trek updated
        "404":
          description: Trek not found

    delete:
      tags: [Admin]
      summary: Delete a trek
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trek deleted
        "404":
          description: Trek not found

  /api/admin/treks/{id}/assign:
    put:
      tags: [Admin]
      summary: Assign or unassign staff to a trek
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                staff_id:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Staff assigned
        "404":
          description: Trek or staff not found

  # ─────────── Admin - Staff Management ───────────
  /api/admin/staff:
    get:
      tags: [Admin]
      summary: List all staff members
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of staff
    post:
      tags: [Admin]
      summary: Create a new staff member
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                specialization:
                  type: string
                experience_years:
                  type: integer
      responses:
        "201":
          description: Staff created
        "400":
          description: Missing fields or email exists

  # ─────────── Admin - User Management ───────────
  /api/admin/users:
    get:
      tags: [Admin]
      summary: List all trekker users
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of users

  /api/admin/users/{id}/blacklist:
    put:
      tags: [Admin]
      summary: Toggle blacklist status of a user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blacklist toggled
        "404":
          description: User not found

  # ─────────── Admin - Bookings ───────────
  /api/admin/bookings:
    get:
      tags: [Admin]
      summary: View all bookings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of all bookings

  # ─────────── Admin - Search ───────────
  /api/admin/search:
    get:
      tags: [Admin]
      summary: Search treks, staff, and users
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results grouped by category

  # ─────────── Admin - Export ───────────
  /api/admin/export/{type}:
    post:
      tags: [Admin]
      summary: Export treks or bookings as CSV
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [treks, bookings]
      responses:
        "200":
          description: Export file generated and download URL returned

  /api/admin/download/{filename}:
    get:
      tags: [Admin]
      summary: Download exported CSV file
      security:
        - BearerAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CSV file download

  # ─────────── Staff ───────────
  /api/staff/treks:
    get:
      tags: [Staff]
      summary: Get treks assigned to the logged-in staff
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of assigned treks

  /api/staff/treks/{id}/status:
    put:
      tags: [Staff]
      summary: Update trek status
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, approved, open, closed, completed]
      responses:
        "200":
          description: Status updated
        "404":
          description: Trek not found or not assigned

  /api/staff/treks/{id}/slots:
    put:
      tags: [Staff]
      summary: Update available slots for an assigned trek
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available_slots]
              properties:
                available_slots:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Slots updated
        "400":
          description: Invalid slot value
        "404":
          description: Trek not found or not assigned

  /api/staff/treks/{id}/bookings:
    get:
      tags: [Staff]
      summary: View bookings for an assigned trek
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of bookings for the trek

  # ─────────── Trekker - Browse & Book ───────────
  /api/treks:
    get:
      tags: [Trekker]
      summary: Browse open treks with optional search and filter
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by trek name or location
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [easy, moderate, hard]
        - name: location
          in: query
          schema:
            type: string
        - name: duration
          in: query
          schema:
            type: integer
          description: Max duration in days
      responses:
        "200":
          description: List of open treks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trek"

  /api/bookings:
    get:
      tags: [Trekker]
      summary: Get all bookings for the logged-in user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of user bookings

    post:
      tags: [Trekker]
      summary: Book a trek
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trek_id]
              properties:
                trek_id:
                  type: integer
      responses:
        "201":
          description: Trek booked
        "400":
          description: Trek not open or no slots
        "409":
          description: Already booked

  /api/bookings/{id}/cancel:
    put:
      tags: [Trekker]
      summary: Cancel a booking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking cancelled
        "404":
          description: Booking not found

  # ─────────── Trekker - Profile ───────────
  /api/profile:
    get:
      tags: [Trekker]
      summary: Get logged-in user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile data

    put:
      tags: [Trekker]
      summary: Update profile (name or password)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                password:
                  type: string
                  minLength: 4
      responses:
        "200":
          description: Profile updated
        "400":
          description: Password too short

  # ─────────── Trekker - Export ───────────
  /api/export/bookings:
    post:
      tags: [Trekker]
      summary: Trigger async CSV export of booking history
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Export task started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  task_id:
                    type: string

  /api/export/status/{task_id}:
    get:
      tags: [Trekker]
      summary: Check export task status
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, done, failed]
                  filename:
                    type: string

  /api/download/{filename}:
    get:
      tags: [Trekker]
      summary: Download exported CSV file
      security:
        - BearerAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CSV file download
